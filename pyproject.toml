[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-iac"
version = "0.1.0"
description = "Declarative Infrastructure-as-Code management system for GitHub (GHEC, GHES, EMU)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GitHub Management Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.15.1",
    "pynacl>=1.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
gh-iac = "gh_iac.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_iac"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"


