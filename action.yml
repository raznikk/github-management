name: "GitHub IaC Action"
description: "Declarative Infrastructure as Code engine for GitHub Enterprise (GHEC, GHES, EMU)"
author: "GitHub Management Team"
inputs:
  command:
    description: "gh-iac command to run: validate, lint, plan, apply, drift, import"
    required: true
    default: "plan"
  path:
    description: "Path to manifest file or directory"
    required: true
    default: "examples/full_stack.yaml"
  target:
    description: "Target environment: ghec, ghes, or emu"
    required: false
    default: "ghec"
  token:
    description: "GitHub API Token"
    required: false
  enterprise:
    description: "Enterprise slug"
    required: false
  output-format:
    description: "Output format: default, json, or markdown"
    required: false
    default: "default"
  auto-approve:
    description: "Auto-approve changes for apply command"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Run gh-iac command
      shell: bash
      env:
        INPUT_CMD: ${{ inputs.command }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ENTERPRISE: ${{ inputs.enterprise }}
        INPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_AUTO: ${{ inputs.auto-approve }}
      run: |
        ARGS=("$INPUT_CMD" "$INPUT_PATH")
        if [ "$INPUT_CMD" != "validate" ] && [ "$INPUT_CMD" != "lint" ]; then
          ARGS+=("--target" "$INPUT_TARGET")
          [ -n "$INPUT_TOKEN" ] && ARGS+=("--token" "$INPUT_TOKEN")
          [ -n "$INPUT_ENTERPRISE" ] && ARGS+=("--enterprise" "$INPUT_ENTERPRISE")
        fi

        if [ "$INPUT_CMD" = "plan" ]; then
          if [ "$INPUT_FORMAT" = "json" ]; then
            ARGS+=("--json")
          elif [ "$INPUT_FORMAT" = "markdown" ]; then
            ARGS+=("--markdown")
          fi
        fi

        if [ "$INPUT_CMD" = "apply" ] && [ "$INPUT_AUTO" = "true" ]; then
          ARGS+=("--auto-approve")
        fi

        uv run gh-iac "${ARGS[@]}"
