# Phase 1: Enterprise Level
apiVersion: github.iac/v1alpha1
kind: EnterprisePolicy
metadata:
  name: octo-enterprise-policy
  enterprise: octocorp
spec:
  enabled_repositories: all
  allowed_actions: selected

---
# Phase 1: EMU SCIM External Group Mapping
apiVersion: github.iac/v1alpha1
kind: EMUExternalGroup
metadata:
  name: SecOps-Global-Engineering
  enterprise: octocorp
spec:
  externalId: okta-group-998822
  displayName: SecOps-Global-Engineering

---
# Phase 2: Enterprise Governance & Security Analysis
apiVersion: github.iac/v1alpha1
kind: EnterpriseSecuritySetting
metadata:
  name: enterprise-security-baseline
  enterprise: octocorp
spec:
  advanced_security_enabled_for_new_repositories: true
  secret_scanning_enabled_for_new_repositories: true
  secret_scanning_push_protection_enabled_for_new_repositories: true

---
# Phase 2: Governance Custom Repository Role
apiVersion: github.iac/v1alpha1
kind: CustomRepositoryRole
metadata:
  name: security-auditor
  organization: octocorp-cloud
spec:
  description: Custom role allowing security team read access and triage rights
  base_role: read
  permissions:
    - triage
    - view_secret_scanning_alerts

---
# Phase 3: Organization & Team Constructs
apiVersion: github.iac/v1alpha1
kind: Organization
metadata:
  name: octocorp-cloud
spec:
  description: OctoCorp Cloud Engineering Platform
  email: cloud-admin@octocorp.internal
  requiresTwoFactorAuthentication: true

---
apiVersion: github.iac/v1alpha1
kind: Team
metadata:
  name: cloud-platform-team
  organization: octocorp-cloud
spec:
  name: Cloud Platform Team
  description: Platform engineers managing cloud infrastructure
  privacy: closed

---
# Organization-Wide Governance Ruleset (Applies across all repositories in org)
apiVersion: github.iac/v1alpha1
kind: OrganizationRuleset
metadata:
  name: org-default-protection
  organization: octocorp-cloud
spec:
  name: org-default-protection
  target: branch
  enforcement: active
  conditions:
    ref_name:
      include:
        - refs/heads/main
  rules:
    - type: pull_request
      parameters:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
    - type: non_fast_forward

---
# Organization Actions Configuration Variable
apiVersion: github.iac/v1alpha1
kind: OrganizationVariable
metadata:
  name: DOCKER_REGISTRY_URL
  organization: octocorp-cloud
spec:
  value: ghcr.io/octocorp-cloud
  visibility: all

---
# Organization Actions Self-Hosted Runner Group
apiVersion: github.iac/v1alpha1
kind: OrganizationRunnerGroup
metadata:
  name: k8s-build-runners
  organization: octocorp-cloud
spec:
  visibility: all
  allows_public_repositories: false

---
# Organization Audit & Security Event Webhook
apiVersion: github.iac/v1alpha1
kind: OrganizationWebhook
metadata:
  name: siem-audit-webhook
  organization: octocorp-cloud
spec:
  name: web
  config:
    url: https://siem.octocorp.internal/github-events
    content_type: json
    secret: env:ORG_WEBHOOK_SECRET
  events:
    - repository
    - member
    - team
  active: true

---
# Phase 4: Repository and Branch Ruleset Constructs
apiVersion: github.iac/v1alpha1
kind: Repository
metadata:
  name: core-infrastructure
  organization: octocorp-cloud
spec:
  description: Core Terraform & Kubernetes manifests
  visibility: private
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true

---
apiVersion: github.iac/v1alpha1
kind: RepositoryRuleset
metadata:
  name: protect-main
  organization: octocorp-cloud
  repository: core-infrastructure
spec:
  name: protect-main
  target: branch
  enforcement: active
  conditions:
    ref_name:
      include:
        - refs/heads/main
  rules:
    - type: pull_request
      parameters:
        required_approving_review_count: 2
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
    - type: required_status_checks
      parameters:
        strict_required_status_checks_policy: true

---
# Phase 2: Enterprise Audit Log Streaming
apiVersion: github.iac/v1alpha1
kind: EnterpriseAuditStream
metadata:
  name: splunk-audit-stream
  enterprise: octocorp
spec:
  stream_type: Splunk
  settings:
    domain: https://splunk.internal:8088
    token: env:SPLUNK_HEC_TOKEN
  enabled: true

---
# Phase 2: EMU IdP Group to Organization Team Link
apiVersion: github.iac/v1alpha1
kind: EMUTeamMapping
metadata:
  name: cloud-platform-idp-link
  enterprise: octocorp
  organization: octocorp-cloud
spec:
  team_slug: cloud-platform-team
  group_id: 998822

---
# Phase 2: Organization Actions Secret (Libsodium Encrypted)
apiVersion: github.iac/v1alpha1
kind: OrganizationSecret
metadata:
  name: DATADOG_API_KEY
  organization: octocorp-cloud
spec:
  value: env:DATADOG_API_KEY
  visibility: all

---
# Organization Actions Secret with Selected Repository Scope
apiVersion: github.iac/v1alpha1
kind: OrganizationSecret
metadata:
  name: SNYK_TOKEN
  organization: octocorp-cloud
spec:
  value: env:SNYK_API_TOKEN
  visibility: selected
  selected_repository_ids:
    - 554433

---
# Phase 2: Repository Actions Secret (Libsodium Encrypted)
apiVersion: github.iac/v1alpha1
kind: RepositorySecret
metadata:
  name: PROD_DATABASE_URL
  organization: octocorp-cloud
  repository: core-infrastructure
spec:
  value: env:PROD_DATABASE_URL

---
# Phase 2: EMU SCIM User Provisioning
apiVersion: github.iac/v1alpha1
kind: EMUSCIMUser
metadata:
  name: jdoe_octocorp
  enterprise: octocorp
spec:
  userName: jdoe_octocorp
  name:
    givenName: Jane
    familyName: Doe
  emails:
    - value: jdoe@octocorp.com
      primary: true
  roles:
    - value: enterprise_owner
  active: true

---
# Phase 2: Enterprise Custom Role
apiVersion: github.iac/v1alpha1
kind: EnterpriseCustomRole
metadata:
  name: enterprise-compliance-auditor
  enterprise: octocorp
spec:
  description: Enterprise-wide compliance auditor permissions
  base_role: read
  permissions:
    - view_audit_log
    - view_enterprise_policies

---
# Phase 2: Enterprise Actions Runner Group
apiVersion: github.iac/v1alpha1
kind: EnterpriseRunnerGroup
metadata:
  name: pci-isolated-runners
  enterprise: octocorp
spec:
  visibility: selected
  selected_organization_ids:
    - 10101
  allows_public_repositories: false

---
# Phase 2: Enterprise-Scoped GitHub App
apiVersion: github.iac/v1alpha1
kind: GitHubApp
metadata:
  name: enterprise-compliance-daemon
  enterprise: octocorp
spec:
  url: https://compliance.octocorp.internal
  description: Enterprise compliance and audit daemon
  public: false
  default_permissions:
    enterprise_administration: read
    enterprise_audit_log: read
  default_events:
    - audit_log_entry
  output_credentials:
    private_key_file: ./secrets/enterprise-compliance.pem

---
# Phase 2: Organization-Scoped GitHub App
apiVersion: github.iac/v1alpha1
kind: GitHubApp
metadata:
  name: release-orchestrator-bot
  organization: octocorp-cloud
spec:
  url: https://release.octocorp.internal
  description: CI/CD release orchestrator
  public: false
  default_permissions:
    contents: write
    pull_requests: write
    actions: read
  default_events:
    - push
    - pull_request
    - release
  output_credentials:
    private_key_file: ./secrets/release-orchestrator.pem



