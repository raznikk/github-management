title: "GitHub IaC Management Engine"
description: "Declarative Infrastructure-as-Code for GitHub Enterprise Cloud, Server, and EMU"
baseurl: "/github-management" # repository subpath on GitHub Pages
url: "https://raznikk.github.io" # base hostname & protocol
repository: "raznikk/github-management"

# GitHub Pages Theme
theme: jekyll-theme-cayman
remote_theme: pages-themes/cayman

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Plugins supported by GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-remote-theme

# Exclude from processing
exclude:
  - .venv/
  - .pytest_cache/
  - .ruff_cache/
  - .mypy_cache/
  - htmlcov/
  - tests/
  - dist/
  - build/
  - Dockerfile
  - Justfile
