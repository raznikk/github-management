repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^examples/.*
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: mypy
        name: mypy (typecheck)
        entry: bash -c 'PATH="$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$PATH" uv run mypy src/gh_iac'
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (unit tests)
        entry: bash -c 'PATH="$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$PATH" uv run --extra dev pytest'
        language: system
        types: [python]
        pass_filenames: false
